[project]
# Distribution name on PyPI. The import name stays `veriq` (e.g. `from veriq import VeriqClient`).
name = "veriq-sdk"
version = "0.2.0"
description = "Official Python SDK for the Veriq AI search, extract, map, and crawl API (beta)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ecolyt.ai LLC", email = "support@ecolyt.ai"}]
keywords = ["search", "ai", "rag", "llm", "web-search", "extraction", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://veriq.ecolyt.ai"
Documentation = "https://veriq.ecolyt.ai/docs/"
Repository = "https://github.com/ecolyt-ai/veriq-sdk-python"
Issues = "https://github.com/ecolyt-ai/veriq-sdk-python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veriq"]

# Ship only the SDK itself. Without this, hatch also packs the monorepo root .gitignore,
# which lists internal paths (infra, compliance) that do not belong in a public package.
[tool.hatch.build.targets.sdist]
only-include = ["veriq", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["**/__pycache__"]
