name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade "build==1.6.1" "twine==7.0.0"
          python -m build
          python -m twine check --strict dist/*
      - name: Install wheel and smoke-test imports
        run: |
          python -m pip install dist/*.whl
          # Run outside the checkout so Python imports the installed wheel, not ./veriq.
          cd "$RUNNER_TEMP"
          python -c "import veriq, sys; assert 'site-packages' in veriq.__file__, veriq.__file__; print('veriq-sdk', veriq.__version__, 'on', sys.version.split()[0])"
          python -c "from veriq import VeriqClient; from veriq.langchain import VeriqSearchResults; print('imports OK')"
