name: Release to PyPI

# Publishes when a maintainer pushes a tag like v0.2.0. Uses PyPI Trusted Publishing (OIDC),
# so no long-lived PyPI token is stored anywhere. The "pypi" environment should require a
# reviewer approval in GitHub (Settings > Environments) before the publish job runs.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('veriq/_version.py').read()).group(1))")
          project=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "_version.py ($version) != tag ($GITHUB_REF_NAME)"; exit 1; }
          test "$version" = "$project" || { echo "_version.py ($version) != pyproject ($project)"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade "build==1.6.1" "twine==7.0.0"
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/veriq-sdk/
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
